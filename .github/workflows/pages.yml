name: Demo (GitHub Pages)

# Builds the in-browser demo (linkly compiled to WebAssembly, see
# cmd/linkly-wasm) and publishes it to GitHub Pages. Requires the repository's
# Pages source to be set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test the demo's Go code (native and js/wasm)
        run: |
          go test -race ./internal/memstore ./demo/...
          GOOS=js GOARCH=wasm go vet ./cmd/linkly-wasm ./internal/memstore
          GOOS=js GOARCH=wasm go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./internal/memstore
      - name: Build
        run: make demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
